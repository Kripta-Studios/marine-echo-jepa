[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marine-echo-jepa"
version = "0.1.0"
description = "Local public-data acoustic research demonstrator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "typer==0.27.2",
  "pydantic==2.13.5", "numpy==2.5.3", "scikit-learn==1.9.1",
  "pyarrow==25.0.1", "psutil==7.2.2",
]

[project.optional-dependencies]
data = ["echopype==0.11.1", "pypdf==6.19.0"]
train = ["torch==2.11.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9", "mypy==2.3.1", "httpx==0.28.1"]

[project.scripts]
marine-echo = "marine_echo.serving.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marine_echo"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["real_data: requires the immutable local acoustic corpus", "gpu: requires verified CUDA"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["external", "release", "data", "outputs"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
